<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ánh Linh - Nút liên hệ</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  .contact-widget {
    position: fixed;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 99999;
  }

  .contact-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    background: #111;
    color: #fff;
    box-shadow: 0 3px 12px rgba(0,0,0,.25);
    border: 2px solid #fff;
    font-family: Arial, sans-serif;
    font-size: 22px;
    transition: transform .2s, background .2s;
    animation: shake 2.8s infinite;
  }

  .contact-btn:nth-child(2) { animation-delay: .25s; }
  .contact-btn:nth-child(3) { animation-delay: .5s; }
  .contact-btn:nth-child(4) { animation-delay: .75s; }

  .contact-btn:hover {
    transform: scale(1.12);
    background: #000;
  }

  @keyframes shake {
    0%, 72%, 100% { transform: translateX(0); }
    75% { transform: translateX(-4px) rotate(-4deg); }
    78% { transform: translateX(4px) rotate(4deg); }
    81% { transform: translateX(-3px) rotate(-3deg); }
    84% { transform: translateX(3px) rotate(3deg); }
    87% { transform: translateX(0); }
  }

  @media (max-width: 600px) {
    .contact-widget {
      right: 5px;
      gap: 7px;
    }
    .contact-btn {
      width: 40px;
      height: 40px;
      font-size: 18px;
    }
  }
</style>
</head>
<body>
  <div class="contact-widget">
    <a class="contact-btn" href="tel:0852333146" aria-label="Gọi điện">☎</a>
    <a class="contact-btn" href="https://zalo.me/0852333146" target="_blank" rel="noopener" aria-label="Zalo">Z</a>
    <a class="contact-btn" href="https://www.facebook.com/share/18P7zuzhh5/" target="_blank" rel="noopener" aria-label="Facebook">f</a>
    <a class="contact-btn" href="https://www.google.com/maps/search/?api=1&query=264%2F10%20L%C3%A2m%20Quang%20Ky%2C%20R%E1%BA%A1ch%20Gi%C3%A1%2C%20An%20Giang" target="_blank" rel="noopener" aria-label="Bản đồ">⌖</a>
  </div>
</body>
</html>
